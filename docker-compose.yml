version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisstor-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aegisstor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegisstor_change_in_prod}
      - POSTGRES_DB=${POSTGRES_DB:-aegisstor}
    ports:
      - "5432:5432"
    volumes:
      - aegisstor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisstor} -d ${POSTGRES_DB:-aegisstor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegisstor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisstor-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AEGISSTOR_MODE=${AEGISSTOR_MODE:-live}
      - AEGISSTOR_SEED_SYNTHETIC_DEMO=${AEGISSTOR_SEED_SYNTHETIC_DEMO:-false}
      - AEGISSTOR_ALLOW_DEV_SEED=${AEGISSTOR_ALLOW_DEV_SEED:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aegisstor}:${POSTGRES_PASSWORD:-aegisstor_change_in_prod}@postgres:5432/${POSTGRES_DB:-aegisstor}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-replace-with-secure-random-secret-key-at-least-32-chars}
      - SHADOW_MODE_ENABLED=${SHADOW_MODE_ENABLED:-true}
    volumes:
      - aegisstor_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisstor-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aegisstor_pgdata:
  aegisstor_artifacts:
