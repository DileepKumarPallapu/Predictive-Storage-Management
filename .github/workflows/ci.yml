name: AEGISSTOR Production CI/CD Pipeline

on:
  push:
    branches: [ master, main, staging ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend Static Checks, Migrations, Tests & Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip check

      - name: Backend static compile & syntax check
        run: |
          cd backend
          python -m compileall -q app worker.py scripts

      - name: Validate Alembic database migrations
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run full backend test suite
        run: |
          cd backend
          python -m pytest tests/ -q

  frontend-ci:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run oxlint static analysis
        run: |
          cd frontend
          npx oxlint src

      - name: Run TypeScript check & Vite production build
        run: |
          cd frontend
          npm run build
