# ==============================================================================
# AEGISSTOR FLOWSTATE — Render.com Blueprint (Prompt 16.0)
# Zero-cost, free-tier compatible deployment blueprint.
# Frontend: Static Site (global CDN, 100% free)
# Backend: Web Service (Python/FastAPI, binds to $PORT on 0.0.0.0)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: Static Site (React + Vite, Pre-built)
  # ----------------------------------------------------------------------------
  - type: web
    name: aegisstor-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aegisstor-backend
          property: url

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Python Web Service (FastAPI + Uvicorn)
  # ----------------------------------------------------------------------------
  - type: web
    name: aegisstor-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python run.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: AEGISSTOR_MODE
        value: demo
      - key: DATABASE_URL
        value: sqlite:///./aegisstor.db
      - key: SECRET_KEY
        generateValue: true
      - key: SHADOW_MODE_ENABLED
        value: "true"
