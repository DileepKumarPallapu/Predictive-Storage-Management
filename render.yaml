# ==============================================================================
# AEGISSTOR — Render Production / Staging Blueprint
# Services:
#   1. aegisstor-backend (Web Service, FastAPI + Uvicorn + WebSockets)
#   2. aegisstor-worker  (Background Worker, ML Training & Recovery)
#   3. aegisstor-redis   (Key Value / Redis Pub/Sub)
#   4. aegisstor-db      (Managed PostgreSQL)
# Frontend is deployed on Vercel (frontend/ / root vercel.json)
# ==============================================================================

databases:
  - name: aegisstor-db
    plan: starter
    databaseName: aegisstor
    user: aegisstor

services:
  - type: keyvalue
    name: aegisstor-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: aegisstor-backend
    runtime: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: cd backend && python run.py
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AEGISSTOR_MODE
        value: live
      - key: AEGISSTOR_ALLOW_DEV_SEED
        value: "false"
      - key: AEGISSTOR_COOKIE_SECURE
        value: "true"
      - key: AEGISSTOR_COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: aegisstor-db
          property: connectionString
      - key: DB_SSL_MODE
        value: require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aegisstor-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SHADOW_MODE_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://aegisstor.vercel.app,https://frontend-gray-two-29.vercel.app"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: aegisstor-worker
    runtime: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python worker.py
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AEGISSTOR_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: aegisstor-db
          property: connectionString
      - key: DB_SSL_MODE
        value: require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aegisstor-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: aegisstor-backend
          property: envVar
          envVarKey: SECRET_KEY
      - key: CORS_ALLOWED_ORIGINS
        value: "https://aegisstor.vercel.app"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
